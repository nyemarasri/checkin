<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Check-in ส่งของ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#16202e; --muted:#6b7a8d; --line:#e3e8ef;
  --brand:#1f4fd8; --ok:#0a8f4e; --warn:#c2820a; --bad:#c62828; --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Noto Sans Thai","Helvetica Neue",sans-serif;
     background:var(--bg);color:var(--ink);font-size:16px;padding-bottom:90px}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:12px 16px;
       display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;font-weight:600}
header .sub{font-size:12px;opacity:.85}
.back{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
main{padding:12px}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;
      box-shadow:0 1px 3px rgba(16,24,40,.06)}
.row{display:flex;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.big{font-size:19px;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:10px;text-align:center;border-radius:10px;background:#e8ecf3;font-size:14px;font-weight:600}
.tab.on{background:var(--brand);color:#fff}
input,select,textarea,button{font-family:inherit;font-size:16px}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--brand);color:#fff;
     font-weight:700;font-size:16px}
.btn:disabled{opacity:.5}
.btn.ghost{background:#e8ecf3;color:var(--ink)}
.btn.ok{background:var(--ok)}
.bill{border-bottom:1px solid var(--line);padding:12px 2px;display:flex;gap:10px;align-items:center}
.bill:last-child{border:0}
.bill .n{font-weight:700;font-size:15px}
.bill .amt{text-align:right;font-weight:700;white-space:nowrap}
.pill{display:inline-block;font-size:11px;padding:3px 8px;border-radius:99px;background:#eef2f7;color:var(--muted)}
.pill.done{background:#e3f6eb;color:var(--ok)}
.pill.nogeo{background:#fdf3e2;color:var(--warn)}
.pill.late{background:#fdeaea;color:var(--bad);font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:82px;padding:11px 8px;border:1px solid var(--line);background:#fff;
            border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ph{width:72px;height:72px;border-radius:10px;object-fit:cover;border:1px solid var(--line);position:relative}
.phwrap{position:relative}
.phwrap b{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;width:22px;height:22px;
          border-radius:99px;font-size:13px;display:flex;align-items:center;justify-content:center}
.addph{width:72px;height:72px;border-radius:10px;border:1.5px dashed var(--line);background:#fff;
       display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.gps{display:flex;gap:8px;align-items:center;font-size:13px;padding:10px;border-radius:10px;background:#f1f4f9}
.gps.ok{background:#e3f6eb;color:var(--ok)}
.gps.warn{background:#fdf3e2;color:var(--warn)}
.gps.bad{background:#fdeaea;color:var(--bad)}
.footer{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
        background:rgba(255,255,255,.96);border-top:1px solid var(--line)}
#map{height:240px;border-radius:12px;margin-top:8px}
.toast{position:fixed;left:16px;right:16px;bottom:86px;background:#16202e;color:#fff;padding:12px 14px;
       border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none!important}
.queue{background:#fdf3e2;color:var(--warn);padding:8px 12px;font-size:13px;text-align:center}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
      border-radius:99px;animation:s .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <button class="back hidden" id="back">‹</button>
  <div style="flex:1">
    <h1 id="title">งานส่งของวันนี้</h1>
    <div class="sub" id="who">กำลังเข้าสู่ระบบ…</div>
  </div>
</header>
<div class="queue hidden" id="queueBar"></div>
<main id="app"><div class="card muted">กำลังโหลด…</div></main>
<div class="toast" id="toast"></div>

<script>
/* ================= ตั้งค่า ================= */
const CONFIG = {
  LIFF_ID : '2011610853-S2cmiGsP',
  API_URL : 'https://script.google.com/macros/s/AKfycbxYizprGfMi0G6MrdyfwREy9R9nWBS-Afb7ZOW1760YnYPWdXE8oCsoKARO1D8sG7km/exec',
  API_KEY : 'b7b89e6d-b69e-466f-a9cb-dbe5ef0b93a4',
  MAX_PX  : 1280,     // ย่อรูปด้านยาวสุดเหลือกี่ px
  JPEG_Q  : 0.72,
  // 'both'   = เลือกได้ทั้งถ่ายใหม่และเลือกจากอัลบั้ม (ถ่ายด้วยแอปกล้องแล้วรูปเก็บในเครื่องด้วย)
  // 'camera' = บังคับถ่ายสดในแอปเท่านั้น รูปจะไม่ถูกเก็บลงเครื่อง
  PHOTO_SOURCE : 'both'
};

/* ================= state ================= */
let S = { user:null, emp:null, date:null, mine:[], pool:[], bill:null,
          photos:[], gps:null, page:'checkin' };

const $  = s => document.querySelector(s);
const el = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; };
const fmt = n => Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});

function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), ms); }

/* ================= ตรวจค่า CONFIG ================= */
// ตัดช่องว่างหัวท้ายอัตโนมัติ กันกรณีคัดลอกติดมา
['LIFF_ID','API_URL','API_KEY'].forEach(k => { if (typeof CONFIG[k] === 'string') CONFIG[k] = CONFIG[k].trim(); });

function checkConfig(){
  const bad = [];
  const thai = /[฀-๿]/;

  if (!CONFIG.LIFF_ID || thai.test(CONFIG.LIFF_ID))
    bad.push(['LIFF_ID', 'ยังไม่ได้ใส่ค่า — ยังเป็นข้อความตัวอย่างภาษาไทยอยู่', CONFIG.LIFF_ID]);
  else if (!/^\d{8,12}-[0-9a-zA-Z]{6,12}$/.test(CONFIG.LIFF_ID))
    bad.push(['LIFF_ID', 'รูปแบบไม่ถูก ต้องเป็นตัวเลข ขีด ตัวอักษร เช่น 2000123456-aBcDeFgH', CONFIG.LIFF_ID]);

  if (!CONFIG.API_URL || thai.test(CONFIG.API_URL))
    bad.push(['API_URL', 'ยังไม่ได้ใส่ค่า — ยังเป็นข้อความตัวอย่างภาษาไทยอยู่', CONFIG.API_URL]);
  else if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(CONFIG.API_URL))
    bad.push(['API_URL', 'ต้องขึ้นต้น https://script.google.com/macros/s/ และลงท้าย /exec (ห้ามลงท้าย /dev)', CONFIG.API_URL]);

  if (!CONFIG.API_KEY || thai.test(CONFIG.API_KEY))
    bad.push(['API_KEY', 'ยังไม่ได้ใส่ค่า — ยังเป็นข้อความตัวอย่างภาษาไทยอยู่', CONFIG.API_KEY]);

  return bad;
}

function showSetupError(stage, err, extra){
  const detail = (err && (err.message || err.code || String(err))) || 'ไม่ทราบสาเหตุ';
  $('#app').innerHTML = `
    <div class="card">
      <div class="big">ตั้งค่ายังไม่ครบ</div>
      <p class="muted">ติดที่ขั้นตอน: <b>${stage}</b></p>
    </div>
    ${extra || ''}
    <div class="card">
      <div class="muted">ข้อความจากระบบ</div>
      <div style="font-family:monospace;font-size:13px;word-break:break-word">${detail}</div>
    </div>
    <div class="card">
      <div class="muted">ค่าที่หน้านี้อ่านได้ตอนนี้</div>
      <div style="font-family:monospace;font-size:12px;word-break:break-all;line-height:1.9">
        LIFF_ID = ${CONFIG.LIFF_ID || '(ว่าง)'}<br>
        API_URL = ${CONFIG.API_URL || '(ว่าง)'}<br>
        API_KEY = ${CONFIG.API_KEY ? CONFIG.API_KEY.slice(0,4) + '••••' + CONFIG.API_KEY.slice(-4) : '(ว่าง)'}
      </div>
      <p class="muted" style="margin-top:8px">แก้ได้ที่ไฟล์ index.html บน GitHub ส่วน <b>const CONFIG</b> แล้วรอ 1 นาทีก่อนเปิดใหม่</p>
    </div>`;
}

/* ================= API ================= */
async function api(action, data={}) {
  const body = JSON.stringify(Object.assign({action, apiKey:CONFIG.API_KEY, userId:S.user}, data));
  let res;
  try {
    res = await fetch(CONFIG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body});
  } catch (e) {
    throw new Error('ติดต่อหลังบ้านไม่ได้ — ตรวจว่า Deploy เป็น Web app แบบ Who has access = Anyone แล้ว (' + e.message + ')');
  }
  let j;
  try { j = await res.json(); }
  catch (e) { throw new Error('หลังบ้านตอบกลับมาไม่ใช่ข้อมูลที่อ่านได้ — มักเกิดจาก Web App URL ผิด หรือยังไม่ได้ Deploy เวอร์ชันใหม่'); }
  if (!j.ok && j.error) throw new Error(j.error);
  return j;
}

/* ================= เริ่มต้น ================= */
(async function init(){
  let stage = 'ตรวจค่าตั้งต้น';
  try {
    const bad = checkConfig();
    if (bad.length) {
      const rows = bad.map(b => `<div class="card"><b>${b[0]}</b><p class="muted">${b[1]}</p>
        <div style="font-family:monospace;font-size:12px;word-break:break-all;color:var(--bad)">ค่าที่ใส่ไว้: ${b[2] || '(ว่าง)'}</div></div>`).join('');
      $('#app').innerHTML = `<div class="card"><div class="big">ตั้งค่ายังไม่ครบ</div>
        <p class="muted">มี ${bad.length} ค่าที่ต้องแก้ในไฟล์ index.html บน GitHub ส่วน <b>const CONFIG</b></p></div>` + rows;
      $('#who').textContent = 'ยังเปิดใช้งานไม่ได้';
      return;
    }

    stage = 'เข้าสู่ระบบ LINE (liff.init)';
    await liff.init({liffId: CONFIG.LIFF_ID});

    if (!liff.isLoggedIn()) { liff.login(); return; }

    stage = 'อ่านโปรไฟล์ผู้ใช้ (liff.getProfile)';
    const p = await liff.getProfile();
    S.user = p.userId;
    S.page = new URLSearchParams(location.search).get('p') || 'checkin';

    stage = 'ติดต่อหลังบ้าน Apps Script';
    const b = await api('bootstrap');
    if (b.needRegister) {
      $('#app').innerHTML = `<div class="card"><div class="big">ยังไม่ได้ลงทะเบียน</div>
        <p class="muted">กลับไปที่แชท แล้วพิมพ์<br><b>ลงทะเบียน &lt;รหัสพนักงาน&gt;</b><br>เช่น ลงทะเบียน EMP001</p></div>`;
      $('#who').textContent = p.displayName; return;
    }
    S.emp = b.emp; S.date = b.date; S.mine = b.mine; S.pool = b.pool; S.stats = b.stats || {};
    $('#who').textContent = `${b.emp.name} (${b.emp.code}${b.emp.sale_code ? ' · ' + b.emp.sale_code : ''}) · ${thDate(b.date)}`;

    flushQueue();
    if (S.page === 'collect')   return renderCollect();
    if (S.page === 'pin')       return renderPinList();
    if (S.page === 'import')    return renderImport();
    renderList();
  } catch (e) {
    let hint = '';
    if (stage.indexOf('liff.init') >= 0)
      hint = `<div class="card"><b>ตรวจสองอย่างนี้</b>
        <div class="muted">1. LIFF ID ในไฟล์ index.html ตรงกับที่สร้างไว้ใน LINE Developers<br>
        2. Endpoint URL ของ LIFF ตรงกับ GitHub Pages URL และมี / ปิดท้ายเหมือนกัน</div></div>`;
    if (stage.indexOf('หลังบ้าน') >= 0)
      hint = `<div class="card"><b>ตรวจสองอย่างนี้</b>
        <div class="muted">1. Deploy เป็น Web app แบบ Execute as = Me และ Who has access = Anyone<br>
        2. Web App URL ลงท้าย /exec และเป็นเวอร์ชันล่าสุด (Manage deployments → New version)</div></div>`;
    showSetupError(stage, e, hint);
    $('#who').textContent = 'เปิดระบบไม่สำเร็จ';
  }
})();

$('#back').onclick = () => { S.bill=null; S.photos=[]; S.gps=null;
  $('#back').classList.add('hidden');
  S.page==='collect' ? renderCollect() : (S.page==='pin' ? renderPinList() : renderList()); };

function thDate(ymd){ const p=String(ymd).split('-'); return `${p[2]}/${p[1]}/${+p[0]+543}`; }

/* ================= หน้า 1: รายการบิล ================= */
let listTab = 'mine';

function renderList(){
  $('#title').textContent = 'งานส่งของวันนี้';
  const mineDone = S.mine.filter(b=>b.checkin_id).length;
  const rows = (listTab==='mine' ? S.mine : S.pool);

  $('#app').innerHTML = '';
  const st = S.stats || {};
  const openMine = S.mine.filter(b=>!b.checkin_id);

  if (!S.mine.length && S.pool.length) $('#app').appendChild(el(
    `<div class="card"><b>บิลทั้งหมดอยู่ในแท็บ "ยังไม่มีคนรับ"</b>
       <div class="muted">${S.emp.sale_code
          ? 'ตอนนี้ไม่มีบิลค้างของรหัส ' + S.emp.sale_code + ' เลย'
          : 'รหัสเซลส์ประจำตัวคุณยังว่างอยู่ในชีต Employees'} —
       แตะแท็บขวาเพื่อเลือกบิลที่คุณรับไปส่ง บิลจะกลายเป็นของคุณเมื่อกดบันทึก check-in</div>
     </div>`));

  $('#app').appendChild(el(`
    <div class="card">
      <div class="row between">
        <div><div class="muted">ค้างส่งของฉัน</div><div class="big">${openMine.length} บิล</div></div>
        <div style="text-align:right"><div class="muted">ส่งแล้ววันนี้</div>
          <div class="big" style="color:var(--ok)">${mineDone}</div></div>
      </div>
      <div class="muted" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">
        ยอดบิลที่ยังค้าง ${fmt(openMine.reduce((s,b)=>s+Number(b.net_amount||0),0))} บาท
        ${st.late ? ` · <span style="color:var(--bad)">เลยวันที่ในบิลแล้ว ${st.late} ใบ</span>` : ''}
        ${st.future ? ` · ล่วงหน้า ${st.future} ใบ (ยังไม่ถึงรอบส่ง)` : ''}
      </div>
    </div>`));
  $('#app').appendChild(el(`
    <div class="tabs">
      <div class="tab ${listTab==='mine'?'on':''}" onclick="switchTab('mine')">ของฉัน (${S.mine.length})</div>
      <div class="tab ${listTab==='pool'?'on':''}" onclick="switchTab('pool')">ยังไม่มีคนรับ (${S.pool.length})</div>
    </div>`));
  $('#app').appendChild(el(`<input class="inp" id="q" placeholder="ค้นหา เลขที่บิล / ชื่อร้าน" style="margin-bottom:10px">`));

  const card = el('<div class="card"></div>');
  if (!rows.length) card.appendChild(el('<div class="muted">ไม่มีรายการ</div>'));
  rows.forEach(b => card.appendChild(billRow(b)));
  $('#app').appendChild(card);

  $('#q').oninput = e => {
    const q = e.target.value.trim().toLowerCase();
    [...card.children].forEach(c => {
      if (!c.dataset.k) return;
      c.style.display = c.dataset.k.includes(q) ? '' : 'none';
    });
  };
}
function switchTab(t){ listTab=t; renderList(); }

function billRow(b){
  const done = !!b.checkin_id;
  const n = el(`
    <div class="bill" data-k="${(b.doc_no+' '+b.cust_name).toLowerCase()}">
      <div style="flex:1;min-width:0">
        <div class="n">${b.cust_name}</div>
        <div class="muted">${b.doc_no} · ${b.pieces} ชิ้น · ${b.n_lines} รายการ
          ${done ? '<span class="pill done">ส่งแล้ว</span>' : ''}
          ${b.bucket && !done ? `<span class="pill ${b.late?'late':''}">${b.bucket}</span>` : ''}
          ${b.why ? `<span class="pill">${b.why}</span>` : ''}
          ${!b.hasGeo && !done ? '<span class="pill nogeo">ร้านใหม่ ยังไม่มีพิกัด</span>' : ''}
        </div>
      </div>
      <div class="amt">${fmt(b.net_amount)}<div class="muted" style="font-weight:400">${b.sale_code||''}</div></div>
    </div>`);
  if (!done) n.onclick = () => openCheckin(b);
  else n.style.opacity = .55;
  return n;
}

/* ================= หน้า 2: check-in ================= */
function openCheckin(b){
  S.bill = b; S.photos = []; S.gps = null;
  $('#back').classList.remove('hidden');
  $('#title').textContent = b.doc_no;

  $('#app').innerHTML = `
    <div class="card">
      <div class="big">${b.cust_name}</div>
      <div class="muted">${b.doc_no} · รหัสร้าน ${b.cust_code}</div>
      <div class="row between" style="margin-top:10px">
        <div><div class="muted">ยอดบิล</div><div class="big">${fmt(b.net_amount)}</div></div>
        <div style="text-align:right"><div class="muted">จำนวน</div>
          <div class="big">${b.pieces} ชิ้น</div></div>
      </div>
    </div>

    <div class="card">
      <div class="gps" id="gpsBox"><span class="spin" style="border-color:#ccc;border-top-color:#666"></span>
        <span>กำลังหาพิกัด…</span></div>
      <button class="btn ghost" id="regps" style="margin-top:8px;padding:9px;font-size:14px">หาพิกัดใหม่</button>
    </div>

    <div class="card">
      <label>สถานะการส่ง</label>
      <div class="seg" id="segDeliv">
        <button data-v="ส่งครบ" class="on">ส่งครบ</button>
        <button data-v="ส่งไม่ครบ">ส่งไม่ครบ</button>
        <button data-v="ร้านปิด">ร้านปิด</button>
        <button data-v="ปฏิเสธรับ">ปฏิเสธรับ</button>
      </div>
      <div id="adjBox" class="hidden" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
        <b>ยอดใหม่หลังตัดรายการ</b>
        <div class="muted">ตัดรายการในบิลกระดาษแล้วกรอกยอดที่แก้ไว้ ระบบจะเก็บเงินตามยอดนี้</div>
        <input class="inp" id="adjAmt" type="number" inputmode="decimal" style="margin-top:8px"
               placeholder="เช่น ${fmt(Math.round(Number(b.net_amount||0)*0.8))}">
        <div class="row between" style="margin-top:8px">
          <span class="muted">ตัดออกไป</span><b id="cutAmt">—</b>
        </div>
      </div>
      <div id="closedNote" class="hidden" style="margin-top:10px;padding:10px;border-radius:8px;
           background:#fdf3e2;color:var(--warn);font-size:13px"></div>
    </div>

    <div class="card">
      <label>การชำระเงิน</label>
      <div class="seg" id="segPay">

        <label>รูปสินค้า <span id="cProd" class="muted"></span></label>
        <div class="photos" id="phProd"></div>
      </div>

    <div class="card" id="slipCard" style="display:none">

    </div>

    <div class="footer"><button class="btn" id="submit">บันทึก Check-in</button></div>

  getGPS();

  // ส่งไม่ครบ = ตัดรายการหน้าร้าน จบในรอบเดียว → ต้องกรอกยอดใหม่
  // ร้านปิด    = ยังไม่ได้ส่ง → บิลกลับเข้ารายการงานอัตโนมัติ
  S.deliv = 'ส่งครบ';
  segInit('#segDeliv', v => {
    S.deliv = v;
    $('#adjBox').classList.toggle('hidden', v !== 'ส่งไม่ครบ');
    const note = $('#closedNote');
    if (v === 'ร้านปิด') {
      note.textContent = 'บิลนี้จะกลับเข้ารายการงาน ไปส่งใหม่ได้วันหลัง';
      note.classList.remove('hidden');
    } else if (v === 'ปฏิเสธรับ') {
      note.textContent = 'ปิดงานบิลนี้ ยอดที่ต้องเก็บเป็น 0 และนับเป็นยอดที่ส่งไม่ได้';
      note.classList.remove('hidden');
    } else { note.classList.add('hidden'); }
    updateTarget();
  });
  $('#adjAmt').oninput = updateTarget;

  segInit('#segPay', onPayChange);
  onPayChange('ยังไม่เก็บ');

  let promo = false;
  $('#promoToggle').onclick = () => {
    promo = !promo;
    $('#promoToggle').textContent = promo ? 'มีโปร ✓' : 'ไม่มีโปร';
    $('#promoToggle').className = promo ? 'btn ok' : 'btn ghost';
    $('#promoToggle').style.width='auto'; $('#promoToggle').style.padding='9px 16px';
    $('#promoBox').classList.toggle('hidden', !promo);
    S.promo = promo;
    renderPhotos();
  };
  S.promo = false;
  renderPhotos();
  $('#submit').onclick = submitCheckin;
}

function segInit(sel, cb){
  const box = $(sel);
  box.querySelectorAll('button').forEach(b => b.onclick = () => {
    box.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); cb(b.dataset.v);
  });
}
function segVal(sel){ const b=$(sel).querySelector('button.on'); return b?b.dataset.v:''; }

/** ยอดที่ต้องเก็บจริง — เปลี่ยนตามสถานะการส่ง */
function targetAmount(){
  const orig = Number(S.bill.net_amount||0);
  if (S.deliv === 'ส่งไม่ครบ') return Number(($('#adjAmt')||{}).value||0);
  if (S.deliv === 'ร้านปิด' || S.deliv === 'ปฏิเสธรับ') return 0;
  return orig;
}

function updateTarget(){
  const orig = Number(S.bill.net_amount||0);
  const cut = $('#cutAmt');
  if (cut) {
    const c = Math.max(0, orig - targetAmount());
    cut.textContent = S.deliv === 'ส่งไม่ครบ' && targetAmount() ? fmt(c) + ' บาท' : '—';
    cut.style.color = c > 0 ? 'var(--warn)' : 'var(--muted)';
  }
  onPayChange(segVal('#segPay'));
}

function onPayChange(v){
  const net = targetAmount();
  const f = $('#payFields');
  const cash = v==='เงินสด'||v==='สด+โอน', tran = v==='โอน'||v==='สด+โอน';
  const keepC = ($('#cash')||{}).value, keepT = ($('#tran')||{}).value;
  f.innerHTML =
    (cash ? `<label>จำนวนเงินสด</label><input class="inp" id="cash" type="number" inputmode="decimal" value="${keepC||(v==='เงินสด'?net:'')}">` : '') +
    (tran ? `<label>จำนวนที่โอน</label><input class="inp" id="tran" type="number" inputmode="decimal" value="${keepT||(v==='โอน'?net:'')}">` : '');
  $('#slipCard').style.display = tran ? '' : 'none';
  ['#cash','#tran'].forEach(s => { const i=$(s); if(i) i.oninput = calcUnpaid; });
  calcUnpaid();
}

function calcUnpaid(){
  const net = targetAmount();
  const c = Number(($('#cash')||{}).value||0), t = Number(($('#tran')||{}).value||0);
  const u = Math.max(0, net - c - t);
  $('#unpaid').textContent = fmt(u);
  $('#unpaid').style.color = u>1 ? 'var(--warn)' : 'var(--ok)';
  const lbl = $('#unpaidLabel');
  if (lbl) lbl.textContent = S.deliv === 'ส่งครบ' ? 'คงเหลือค้างชำระ'
                           : 'คงเหลือค้างชำระ (จากยอด ' + fmt(net) + ')';
}

/* ---------- GPS ---------- */
function getGPS(){
  const box = $('#gpsBox');
  box.className = 'gps';
  box.innerHTML = '<span class="spin" style="border-color:#ccc;border-top-color:#666"></span><span>กำลังหาพิกัด…</span>';
  if (!navigator.geolocation) { box.className='gps bad'; box.textContent='เครื่องนี้ไม่รองรับ GPS'; return; }
  navigator.geolocation.getCurrentPosition(
    p => {
      S.gps = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, t:Date.now()};
      const a = Math.round(p.coords.accuracy);
      box.className = 'gps ' + (a<=50 ? 'ok' : a<=200 ? 'warn' : 'bad');
      box.innerHTML = `<span>📍</span><span>ได้พิกัดแล้ว · แม่นยำ ±${a} ม.${a>200?' (แนะนำให้ออกมาที่โล่งแล้วกดหาใหม่)':''}</span>`;
    },
    e => { S.gps=null; box.className='gps bad';
           box.innerHTML = '<span>⚠️</span><span>หาพิกัดไม่ได้: '+e.message+' — เปิด Location ให้ LINE แล้วลองใหม่</span>'; },
    {enableHighAccuracy:true, timeout:15000, maximumAge:0}
  );
}

/* ---------- รูป ---------- */
function renderPhotos(){
  [['bill','#phBill','#cBill'],['product','#phProd','#cProd'],['slip','#phSlip',null]].forEach(([type,sel,cnt])=>{
    const box = $(sel); if (!box) return;
    const list = S.photos.filter(p=>p.type===type);
    box.innerHTML = '';
    list.forEach((p,i)=>{
      const w = el(`<div class="phwrap"><img class="ph" src="${p.thumb}"
          style="${p.photoId ? '' : 'opacity:.55;border-color:var(--warn)'}"><b>×</b></div>`);
      if (!p.photoId) w.appendChild(el(`<div style="position:absolute;left:0;right:0;bottom:0;
          background:var(--warn);color:#fff;font-size:9px;text-align:center;border-radius:0 0 10px 10px">รอส่ง</div>`));
      w.querySelector('b').onclick = () => { S.photos.splice(S.photos.indexOf(p),1); renderPhotos(); };
      box.appendChild(w);
    });
    const capture = CONFIG.PHOTO_SOURCE === 'camera' ? ' capture="environment"' : '';
    const add = el(`<label class="addph"><span style="font-size:22px">＋</span>เพิ่มรูป
        <input type="file" accept="image/*"${capture} class="hidden"></label>`);
    add.querySelector('input').onchange = e => addPhoto(e.target.files[0], type);
    box.appendChild(add);
    if (cnt) $(cnt).textContent = list.length ? `(${list.length} รูป)` : '(ต้องมีอย่างน้อย 1 รูป)';
  });
}

async function addPhoto(file, type){
  if (!file) return;
  let dataUrl;
  try { dataUrl = await compress(file); }
  catch(e){ return toast('อ่านไฟล์รูปไม่ได้ ลองถ่ายใหม่', 3500); }

  // อายุของรูป — ถ่ายสดจะเกือบ 0 ถ้าเลือกรูปเก่าจากอัลบั้มจะสูง แล้วระบบจะติดธงให้ผู้จัดการเห็น
  const ageMin = file.lastModified ? Math.max(0, Math.round((Date.now() - file.lastModified)/60000)) : 0;

  const p = {photoId:null, type, thumb:dataUrl, ageMin};
  S.photos.push(p);
  renderPhotos();
  toast('กำลังอัปโหลดรูป…');
  if (await uploadPhoto(p)) { renderPhotos(); toast('อัปโหลดรูปแล้ว'); }
  else { renderPhotos(); toast('อัปโหลดยังไม่สำเร็จ — รูปยังอยู่ จะส่งให้อีกครั้งตอนกดบันทึก', 4500); }
}

/** อัปโหลดรูปหนึ่งใบ คืน true เมื่อสำเร็จ — รูปที่ยังไม่สำเร็จจะถูกเก็บไว้ลองใหม่ */
async function uploadPhoto(p){
  if (p.photoId) return true;
  try {
    const r = await api('uploadPhoto', {
      doc_no:S.bill.doc_no, type:p.type, dataUrl:p.thumb, date:S.date,
      cust_code:S.bill.cust_code, cust_name:S.bill.cust_name,
      expectAmount: p.type==='slip' ? Number(($('#tran')||{}).value||0) : 0
    });
    p.photoId = r.photoId;
    if (r.slip) {
      p.slipId = r.slip.slipId; p.slipAmount = r.slip.amount;
      p.slipRisks = r.slip.risks || []; p.slipStatus = r.slip.status;
      renderSlipResult();
    }
    return true;
  } catch(e){ return false; }
}

function renderSlipResult(){
  const box = $('#slipResult'); if (!box) return;
  const slips = S.photos.filter(p => p.type==='slip' && p.slipStatus);
  if (!slips.length) { box.innerHTML = ''; return; }
  box.innerHTML = slips.map(p => {
    const bad = (p.slipRisks||[]).length;
    return `<div style="margin-top:10px;padding:11px 13px;border-radius:10px;
        background:${bad?'#fdeaea':'#e3f6eb'};color:${bad?'var(--bad)':'var(--ok)'};font-size:13.5px">
      <b>${bad ? '⚠️ สลิปนี้ต้องตรวจ' : '✅ สลิปผ่าน'}</b>
      ${p.slipAmount ? `<div>อ่านยอดได้ ${fmt(p.slipAmount)} บาท</div>` : ''}
      ${bad ? '<div style="margin-top:4px">• ' + p.slipRisks.join('<br>• ') + '</div>' : ''}
    </div>`;
  }).join('');
}

function compress(file){
  return new Promise((res, rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      const sc = Math.min(1, CONFIG.MAX_PX/Math.max(img.width,img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', CONFIG.JPEG_Q));
    };
    img.onerror = rej; img.src = url;
  });
}

/* ---------- ส่ง ---------- */
async function submitCheckin(){
  const deliv = segVal('#segDeliv'), pay = segVal('#segPay');
  const cash = Number(($('#cash')||{}).value||0), tran = Number(($('#tran')||{}).value||0);
  const adj  = Number(($('#adjAmt')||{}).value||0);

  if (deliv === 'ส่งไม่ครบ') {
    if (!adj) return toast('ส่งไม่ครบ ต้องกรอกยอดใหม่หลังตัดรายการ', 3500);
    if (adj > Number(S.bill.net_amount||0) + 1) return toast('ยอดใหม่มากกว่ายอดบิลเดิม', 3500);
  }
  if (!S.gps && !confirm('ยังไม่มีพิกัด GPS — บันทึกต่อโดยไม่มีพิกัดหรือไม่?')) return;
  if (S.promo) {
    if (!S.photos.some(p=>p.type==='bill'))    return toast('เคลมโปร ต้องมีรูปบิลอย่างน้อย 1 รูป', 3500);
    if (!S.photos.some(p=>p.type==='product')) return toast('เคลมโปร ต้องมีรูปสินค้าอย่างน้อย 1 รูป', 3500);
  }
  if (tran > 0 && !S.photos.some(p=>p.type==='slip'))
    if (!confirm('มียอดโอนแต่ยังไม่ได้แนบสลิป — บันทึกต่อหรือไม่?')) return;

  const btn = $('#submit'); btn.disabled = true;

  // ลองอัปโหลดรูปที่ยังค้างอยู่ก่อน
  const pending = S.photos.filter(p=>!p.photoId);
  if (pending.length) {
    btn.innerHTML = '<span class="spin"></span> กำลังส่งรูปที่ค้าง…';
    for (const p of pending) await uploadPhoto(p);
  }

  const payload = {
    doc_no:S.bill.doc_no, date:S.date,
    lat:S.gps?S.gps.lat:'', lng:S.gps?S.gps.lng:'', accuracy:S.gps?S.gps.acc:0,
    deliveryStatus:deliv, adjustedAmount:adj,
    needRevisit: deliv === 'ร้านปิด',        // ร้านปิดเท่านั้นที่ต้องกลับไปใหม่
    payMethod:pay, cash, transfer:tran, hasPromo:!!S.promo,
    photos:S.photos.map(p=>({photoId:p.photoId, type:p.type, ageMin:p.ageMin,
                             slipId:p.slipId, slipAmount:p.slipAmount, slipRisks:p.slipRisks,
                             thumb:p.photoId?null:p.thumb})),
    note:$('#note').value.trim(), deviceTime:new Date().toISOString()
  };

  btn.innerHTML = '<span class="spin"></span> กำลังบันทึก…';
  try {
    const clean = Object.assign({}, payload, {photos: payload.photos.map(p=>
      ({photoId:p.photoId, type:p.type, ageMin:p.ageMin,
        slipId:p.slipId, slipAmount:p.slipAmount, slipRisks:p.slipRisks}))});
    const r = await api('submit', clean);
    S.bill.checkin_id = r.checkinId;
    toast(r.flags && r.flags.length ? '⚠️ บันทึกแล้ว (มีข้อสังเกต)' : '✅ บันทึกแล้ว');
    setTimeout(()=>$('#back').onclick(), 800);
  } catch(e){
    queueOffline(payload);   // เก็บรูปติดไปด้วย จะได้ส่งได้ครบตอนเน็ตกลับมา
    toast('ส่งไม่สำเร็จ — เก็บไว้ในคิวพร้อมรูป จะส่งให้อัตโนมัติเมื่อเน็ตกลับมา', 5000);
    setTimeout(()=>$('#back').onclick(), 1400);
  } finally { btn.disabled=false; btn.textContent='บันทึก Check-in'; }
}

/* ---------- คิว offline ---------- */
const QKEY = 'checkin_queue_v1';
function readQ(){ try { return JSON.parse(localStorage.getItem(QKEY)||'[]'); } catch(e){ return []; } }
function writeQ(q){
  try { localStorage.setItem(QKEY, JSON.stringify(q)); }
  catch(e){
    // เต็มพื้นที่ — ทิ้งรูปในคิวเก่าสุดออกก่อน ดีกว่าเสียทั้งรายการ
    const slim = q.map(x => Object.assign({}, x, {photos:(x.photos||[]).map(p=>({photoId:p.photoId,type:p.type,ageMin:p.ageMin}))}));
    try { localStorage.setItem(QKEY, JSON.stringify(slim)); toast('พื้นที่เก็บในเครื่องเต็ม — เก็บข้อมูลไว้ได้แต่รูปบางส่วนหาย', 5000); }
    catch(e2){ toast('เก็บคิวไม่ได้ พื้นที่ในเครื่องเต็ม', 5000); }
  }
}
function queueOffline(p){ const q = readQ(); q.push(p); writeQ(q); showQueue(); }

function showQueue(){
  const q = readQ();
  const bar = $('#queueBar');
  bar.classList.toggle('hidden', !q.length);
  if (q.length) bar.textContent = `⏳ ค้างส่ง ${q.length} รายการ — จะส่งอัตโนมัติเมื่อเน็ตกลับมา (แตะเพื่อลองใหม่)`;
  bar.onclick = flushQueue;
}

async function flushQueue(){
  let q = readQ();
  if (!q.length) { showQueue(); return; }
  const rest = [];
  for (const item of q) {
    try {
      // อัปโหลดรูปที่ยังไม่มี photoId ก่อน แล้วค่อยส่ง check-in
      for (const p of (item.photos||[])) {
        if (p.photoId || !p.thumb) continue;
        const r = await api('uploadPhoto', {doc_no:item.doc_no, type:p.type, dataUrl:p.thumb, date:item.date});
        p.photoId = r.photoId;
      }
      await api('submit', Object.assign({}, item,
        {photos:(item.photos||[]).map(p=>({photoId:p.photoId, type:p.type, ageMin:p.ageMin}))}));
    } catch(e){ rest.push(item); }
  }
  writeQ(rest); showQueue();
  if (q.length !== rest.length) toast(`ส่งรายการค้างสำเร็จ ${q.length-rest.length} รายการ`);
}
window.addEventListener('online', flushQueue);

      <label>เงินสด</label><input class="inp" id="cash" type="number" inputmode="decimal" value="${i.outstanding}">
      <label>โอน</label><input class="inp" id="tran" type="number" inputmode="decimal" value="">
      <label>สลิป (ถ้าโอน)</label><div class="photos" id="phSlip"></div>
      <label>หมายเหตุ</label><textarea class="inp" id="note" rows="2"></textarea>
    </div>
    <div class="footer"><button class="btn ok" id="submit2">บันทึกรับเงิน</button></div>`;
  segInit('#segPay2', ()=>{});
  renderPhotos();
  $('#submit2').onclick = async ()=>{
    const btn=$('#submit2'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> กำลังบันทึก…';
    try {
      await api('collect', {doc_no:i.doc_no, payMethod:segVal('#segPay2'),
        cash:Number($('#cash').value||0), transfer:Number($('#tran').value||0),
        photos:S.photos.map(p=>({photoId:p.photoId, type:p.type})),
        note:$('#note').value.trim(), deviceTime:new Date().toISOString()});
      toast('✅ บันทึกรับเงินแล้ว'); setTimeout(renderCollect, 800);
    } catch(e){ toast('ไม่สำเร็จ: '+e.message,4000); }
    finally{ btn.disabled=false; btn.textContent='บันทึกรับเงิน'; }
  };
}

/* ================= หน้า: นำเข้าไฟล์บิล (ออฟฟิศ/ผู้จัดการ) ================= */
function renderImport(){
  $('#title').textContent = 'นำเข้าไฟล์บิล';
  $('#back').classList.add('hidden');
  $('#app').innerHTML = `
    <div class="card">
      <div class="big">อัปโหลดไฟล์ใบขายเชื่อ</div>
      <div class="muted">เลือกไฟล์ CSV ที่ export จาก ERP ได้เลย ระบบจะนำเข้าทันที
        ไม่ต้องเปิด Google Drive หรือ Apps Script</div>
      <label class="btn" style="display:block;text-align:center;margin-top:14px">
        เลือกไฟล์ CSV
        <input type="file" accept=".csv,text/csv" id="csvFile" class="hidden">
      </label>
      <div id="impResult" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <b>ข้อควรรู้</b>
      <div class="muted">
        • บิลที่เลขที่เอกสารซ้ำกับที่มีอยู่แล้ว ระบบจะข้ามให้อัตโนมัติ อัปซ้ำได้ไม่เสียหาย<br>
        • อัปไฟล์จาก ERP ตรงๆ อย่าเปิดแก้ใน Excel แล้วเซฟทับ ชื่อร้านจะเพี้ยน<br>
        • ไฟล์ต้นฉบับถูกเก็บไว้ในโฟลเดอร์ Bills Imported เป็นหลักฐาน
      </div>
    </div>`;

  $('#csvFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const box = $('#impResult');
    box.innerHTML = '<span class="spin" style="border-color:#ccc;border-top-color:#666"></span> กำลังนำเข้า…';
    try {
      const dataB64 = await fileToB64(f);
      const r = await api('importCsv', {fileName:f.name, dataB64});
      box.innerHTML = `<div style="background:var(--ok);color:#fff;padding:12px;border-radius:10px">
        ✅ นำเข้าสำเร็จ ${r.imported} บิล${r.imported===0?' (ทุกบิลในไฟล์มีอยู่แล้ว)':''}</div>`;
      toast('นำเข้าเรียบร้อย');
    } catch(err){
      box.innerHTML = `<div style="background:var(--bad);color:#fff;padding:12px;border-radius:10px">
        ${err.message}</div>`;
    }
    e.target.value = '';
  };
}

function fileToB64(file){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* ================= หน้า: ปักหมุดร้าน ================= */
function renderPinList(){
  $('#title').textContent = 'ปักหมุดร้าน';
  $('#back').classList.add('hidden');
  const all = S.mine.concat(S.pool);
  const noGeo = all.filter(b=>!b.hasGeo);
  $('#app').innerHTML = `<div class="card"><b>ร้านที่ยังไม่มีพิกัด ${noGeo.length} ร้าน</b>
    <div class="muted">ยืนอยู่หน้าร้าน แล้วกดปักหมุด — หรือลากหมุดบนแผนที่ให้ตรงตำแหน่ง</div></div>`;
  const card = el('<div class="card"></div>');
  (noGeo.length ? noGeo : all).forEach(b=>{
    const n = el(`<div class="bill"><div style="flex:1"><div class="n">${b.cust_name}</div>
      <div class="muted">${b.cust_code} ${b.hasGeo?'<span class="pill done">มีพิกัดแล้ว</span>':''}</div></div>
      <div class="amt">›</div></div>`);
    n.onclick = ()=>openPin(b); card.appendChild(n);
  });
  $('#app').appendChild(card);
}

function openPin(b){
  $('#back').classList.remove('hidden'); $('#title').textContent = 'ปักหมุด: ' + b.cust_name;
  $('#app').innerHTML = `<div class="card"><div class="big">${b.cust_name}</div>
      <div class="muted">${b.cust_code}</div>
      <div class="gps" id="gpsBox">กำลังหาพิกัด…</div>
      <div id="map"></div>
      <div class="muted" style="margin-top:6px">ลากหมุดให้ตรงตำแหน่งหน้าร้านได้</div>
      <label>หมายเหตุ (เช่น ปากซอย / ตรงข้ามปั๊ม)</label>
      <input class="inp" id="note">
    </div>
    <div class="footer"><button class="btn ok" id="pinSave" disabled>บันทึกพิกัดร้านนี้</button></div>`;

  let map, marker;
  navigator.geolocation.getCurrentPosition(p=>{
    const lat=p.coords.latitude, lng=p.coords.longitude;
    S.gps = {lat, lng, acc:p.coords.accuracy};
    $('#gpsBox').className = 'gps ok';
    $('#gpsBox').textContent = `📍 ±${Math.round(p.coords.accuracy)} ม.`;
    map = L.map('map').setView([lat,lng], 18);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    marker = L.marker([lat,lng], {draggable:true}).addTo(map);
    marker.on('dragend', ()=>{ const ll=marker.getLatLng(); S.gps.lat=ll.lat; S.gps.lng=ll.lng; });
    $('#pinSave').disabled = false;
  }, e=>{ $('#gpsBox').className='gps bad'; $('#gpsBox').textContent='หาพิกัดไม่ได้: '+e.message; },
     {enableHighAccuracy:true, timeout:15000, maximumAge:0});

  $('#pinSave').onclick = async ()=>{
    try {
      await api('pinStore', {cust_code:b.cust_code, cust_name:b.cust_name,
        lat:S.gps.lat, lng:S.gps.lng, note:$('#note').value.trim()});
      b.hasGeo = true; toast('✅ บันทึกพิกัดร้านแล้ว'); setTimeout(renderPinList, 800);
    } catch(e){ toast('ไม่สำเร็จ: '+e.message, 4000); }
  };
}
</script>
